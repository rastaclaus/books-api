[project]
name = "books-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Shestopalov", email = "tema.rastaclaus2016@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
books-api = "books_api:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
# Tutorial markdown contains Python snippets; do not lint or format them.
extend-exclude = ["tutorial"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with `ruff format`.
    "COM812",
    "ISC001",
    # No copyright headers in a teaching project.
    "CPY001",
    # Mutually exclusive docstring styles; docstrings are not enforced at all.
    "D",
    "D203",
    "D213",
    # Russian-language text is legitimate here.
    "RUF001",
    "RUF002",
    "RUF003",
    # Message construction is deliberate and readable in exceptions.
    "EM101",
    "EM102",
    "TRY003",
    # Runtime imports are cheap in a pure domain crate.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"src/books_api/__init__.py" = ["T201"]
"tests/**" = ["S101", "PLR2004", "SLF001", "FBT003", "INP001"]
"tools/**" = ["EXE001", "INP001", "T201"]
"scripts/**" = ["EXE001", "INP001", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]
environment.python-version = "3.14"
terminal.error-on-warning = true

[tool.ty.rules]
all = "error"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
dynamic-function-decorator-return = "ignore"
